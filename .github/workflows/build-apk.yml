name: Build Decision Pulse APK

on:
  push:
    paths:
      - 'build-trigger.txt'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK with apksigner
        run: |
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk

      - name: Inspect package with aapt2
        run: |
          AAPT2="$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt2"
          "$AAPT2" dump badging app/build/outputs/apk/debug/app-debug.apk

      - name: Save verified APK
        uses: actions/upload-artifact@v4
        with:
          name: DecisionPulse-verified
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 1
